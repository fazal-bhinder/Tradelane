<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tradelane checks where each supplier product makes money: landed cost, fees, duty and FX per marketplace, with a review queue before anything is listed." />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <title>Tradelane</title>
    <script>
      try {
        const t = localStorage.getItem("tl-theme");
        const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
